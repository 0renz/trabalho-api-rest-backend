<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Alunos & Matérias — Documentação</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui.min.css" />
    <style>
      body { margin: 0; background: #fafafa; }
      .topbar { background: #1b3a6b !important; }
      .topbar-wrapper img { content: none !important; }
      .topbar-wrapper::after {
        content: "📚 API — Alunos & Matérias";
        color: #fff;
        font-size: 1.1rem;
        font-weight: 600;
        letter-spacing: .5px;
      }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-standalone-preset.min.js"></script>
    <script>
      window.onload = function () {
        SwaggerUIBundle({
          url: "/api-docs/swagger.json",
          dom_id: "#swagger-ui",
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          layout: "StandaloneLayout",
          deepLinking: true,
          defaultModelsExpandDepth: 1,
          defaultModelExpandDepth: 1,
          displayRequestDuration: true,
          tryItOutEnabled: true,
        });
      };
    </script>
  </body>
</html>
